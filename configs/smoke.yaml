# Smoke test: does the whole GPU path work end to end? 6 cells x 5 samples = 30 runs.
experiment: smoke
model: models/qwen3.8-27b-nothink.yaml
scenarios: [sharing_risky, sharing_benign]
lengths: [5, 20, 50]
patterns: [none]
n_samples: 5
arm: baseline
max_steps: 8
# the first sample of each cell goes alone to warm the prefix cache, then the other four together
concurrency: 4

# Logprob mode only (`sc logprob`); sampled runs ignore this and their run ids do not change.
# `after_lookup` exists because in the smoke run most risky samples called lookup_person before
# anything else: the point where the model really chooses between checking and sending comes
# after that call, not at the start.
probe_points:
  - id: start
  - id: after_lookup
    calls:
      - tool: lookup_person
        args: {query: $recipient_first_name}
