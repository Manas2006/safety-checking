# Where the assurance comes from (PREREG.md, follow-ups): the handoff worker with the access-list
# rule (arm B's prompt), and the orchestrator's claim that the check was done coming from a peer
# worker, as a pasted get_access_list result, or with no tool named. Each is compared with arm F
# (the orchestrator's own claim) in handoff.jsonl. The pointer arm replaces the rule with a line
# pointing at Sam's standing rules and is compared with arms D and B.
# 8 scenarios x 1 length x 50 samples = 400 runs.
experiment: handoff_source
model: models/qwen3.5-9b-nothink.yaml
scenarios:
  - sharing_incontext_risky_hop_assured_peer
  - sharing_incontext_benign_hop_assured_peer
  - sharing_incontext_risky_hop_assured_toolpaste
  - sharing_incontext_benign_hop_assured_toolpaste
  - sharing_incontext_risky_hop_assured_notool
  - sharing_incontext_benign_hop_assured_notool
  - sharing_incontext_risky_hop_pointer
  - sharing_incontext_benign_hop_pointer
lengths: [5]
patterns: [none]
n_samples: 50
arm: baseline
max_steps: 8
concurrency: 16

# Logprob mode only (`both` or `logprob` on the job line).
probe_points:
  - id: start
