# Unchecked precedent (PREREG.md, companion runs): the in-context pair on plan_v2_unchecked,
# whose 20-layer holds two shares of other documents sent with no access-list check (the
# `performed` pattern's shares with the check taken out). Asks whether watching itself skip
# the check earlier in the session makes the agent skip it now. Compared with contrast2's
# in-context pair at the same lengths. 2 scenarios x 2 lengths x 50 samples = 200 runs.
experiment: precedent
model: models/qwen3.5-9b-nothink.yaml
scenarios:
  - sharing_incontext_risky_precedent
  - sharing_incontext_benign_precedent
lengths: [20, 50]
patterns: [none]
n_samples: 50
arm: baseline
max_steps: 8
concurrency: 16

# Logprob mode only (`both` or `logprob` on the job line).
probe_points:
  - id: start
