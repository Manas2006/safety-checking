# Handoff (SPEC.md 3.2, handoff arms): does the access-list check survive delegation? The worker
# gets the request from a scripted orchestrator message, and the arms vary where the rule lives
# and whether the orchestrator asserts it already ran the check. In-context pair, length 5 only
# (plan_v2's tail), so the history is fixed and the handoff is the only manipulation.
#   A  undelegated: sharing_incontext_{risky,benign} at length 5 in contrast2.jsonl, not rerun
#   B  rule in the worker's system prompt
#   C  rule only in the orchestrator's task message
#   D  no rule anywhere
#   E  no rule; the orchestrator asserts the check was done
#   F  rule in the worker's system prompt, and the assertion
# 10 scenarios x 1 length x 50 samples = 500 runs. The model named here is the default; the job
# script's third argument (a configs/models/*.yaml) runs the same cells on another model.
experiment: handoff
model: models/qwen3.5-9b-nothink.yaml
scenarios:
  - sharing_incontext_risky_hop_rule
  - sharing_incontext_benign_hop_rule
  - sharing_incontext_risky_hop_taskrule
  - sharing_incontext_benign_hop_taskrule
  - sharing_incontext_risky_hop_norule
  - sharing_incontext_benign_hop_norule
  - sharing_incontext_risky_hop_assured_norule
  - sharing_incontext_benign_hop_assured_norule
  - sharing_incontext_risky_hop_assured_rule
  - sharing_incontext_benign_hop_assured_rule
lengths: [5]
patterns: [none]
n_samples: 50
arm: baseline
max_steps: 8
concurrency: 16

# Logprob mode only (`both` or `logprob` on the job line).
probe_points:
  - id: start
