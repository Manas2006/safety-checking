# Qwen/Qwen3.5-9B, BF16, non-thinking mode, ONE A100 40 GB: qwen3.5-9b-nothink.yaml with
# max_model_len 65536 so that the 200-call histories fit. Same weights, revision, sampling and
# server otherwise. A separate file because max_model_len is hashed into every run id and the
# queued jobs read the original at start.
#
# Everything in this file is hashed into the adapter name, and so into every run id.

id: qwen3.5-9b-nothink-64k
hf_repo: Qwen/Qwen3.5-9B
revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a
served_model_name: qwen3.5-9b

serve:
  vllm_version: "0.29.0"
  tensor_parallel_size: 1
  # Native limit 262144. The 200-call history is about 27k o200k tokens and a run is about
  # 35k; 65536 leaves room for a tokenizer that splits our JSON less well.
  max_model_len: 65536
  dtype: bfloat16
  gpu_memory_utilization: 0.90
  max_num_seqs: 16
  seed: 0
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
  enable_prefix_caching: true
  host: 127.0.0.1
  port: 8000
  startup_timeout_s: 1200
  extra_args:
    # text only: do not reserve memory for image or video inputs
    - --limit-mm-per-prompt
    - '{"image": 0, "video": 0}'
  env:
    # LS6 compute nodes have no nvcc, and FlashInfer's sampler JIT-compiles at warm-up
    # (job 3458103). See qwen3.8-27b-nothink.yaml.
    VLLM_USE_FLASHINFER_SAMPLER: "0"

request:
  sampling:
    temperature: 0.7
    top_p: 0.8
    presence_penalty: 1.5
    max_tokens: 1024
  extra_body:
    top_k: 20
    min_p: 0.0
    repetition_penalty: 1.0
    chat_template_kwargs:
      enable_thinking: false
  base_seed: 0

# Logprob mode (SPEC.md 3.10). Read off this model's rendered prompt from job 3458956
# (outputs/renders/sharing_risky.L50.none.qwen3.5-9b-nothink.txt): the same opener as the 27B.
# Not part of the config hash.
logprob:
  call_opener: "<tool_call>\n<function="
  name_terminator: ">"

notes: >-
  qwen3.5-9b-nothink with a 65536 context, for the *_long scenarios. Everything else is
  identical; the run ids differ because max_model_len is hashed.
