# Real orchestrator messages (PREREG.md, batch of 2026-10-27; `orchestrate` mode of the job
# script, `sc orchestrate`). The served model plays Sam's assistant with the in-context risky
# scenario's role and four standing rules, plus one sentence saying it delegates to a worker that
# sees only its message, and writes the delegation message for that scenario's request. No
# history, no tools. 200 messages per model, saved to outputs/orchestrator/<model id>.jsonl and
# classified by string rules (names_tool, mentions_access_list, asserts_done, none). lengths and
# patterns only serve the job script's render check, which renders the scenario's own prefix.
experiment: orchestrate
model: models/qwen3.5-9b-nothink.yaml
scenarios: [sharing_incontext_risky]
lengths: [5]
patterns: [none]
n_samples: 200
arm: baseline
max_steps: 8
concurrency: 16
