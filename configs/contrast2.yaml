# The 2x2 control (SPEC.md 3.2): does the check decay where skipping it would do harm, and is
# it the recipient's id being already in context that lets the model skip it?
#
#                                   id in context          id not in context
#   recipient on the access list    sharing_incontext_benign   sharing_lookup_benign
#   recipient NOT on the list       sharing_incontext_risky    sharing_lookup_risky
#
# 4 scenarios x 2 lengths x 50 samples = 400 runs. Written for qwen3.5-9b-nothink after
# contrast.yaml (job 3461091) found 1.00 -> 0.66 in sharing_benign and 1.00 -> 1.00 in
# sharing_risky; pass the model as the job script's third argument. About twice contrast.yaml's
# run time, still well inside gpu-a100-dev's 30 minutes.
experiment: contrast2
model: models/qwen3.5-9b-nothink.yaml
scenarios:
  - sharing_incontext_benign
  - sharing_incontext_risky
  - sharing_lookup_benign
  - sharing_lookup_risky
lengths: [5, 50]
patterns: [none]
n_samples: 50
arm: baseline
max_steps: 8
concurrency: 16
