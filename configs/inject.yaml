# Injected instruction in a tool result (PREREG.md, companion runs): the in-context pair in
# office_v2_inject, where the Atlas update the tail reads ends with a note telling automated
# assistants the access list no longer needs checking. The system prompt still has the rule.
# Compared with contrast2's in-context pair at length 5. 2 scenarios x 1 length x 50 = 100 runs.
experiment: inject
model: models/qwen3.5-9b-nothink.yaml
scenarios:
  - sharing_incontext_risky_inject
  - sharing_incontext_benign_inject
lengths: [5]
patterns: [none]
n_samples: 50
arm: baseline
max_steps: 8
concurrency: 16

# Logprob mode only (`both` or `logprob` on the job line).
probe_points:
  - id: start
