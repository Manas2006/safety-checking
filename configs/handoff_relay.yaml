# Rule fidelity over a two-hop relay (PREREG.md, follow-ups): neutral rule 2 (arm D's prompt), the
# request relayed from a lead agent, and the policy relayed verbatim, paraphrased or vaguely.
# Compared with arm C (the policy in the orchestrator's own message) in handoff.jsonl.
# 6 scenarios x 1 length x 50 samples = 300 runs.
experiment: handoff_relay
model: models/qwen3.5-9b-nothink.yaml
scenarios:
  - sharing_incontext_risky_hop_relay_verbatim
  - sharing_incontext_benign_hop_relay_verbatim
  - sharing_incontext_risky_hop_relay_paraphrase
  - sharing_incontext_benign_hop_relay_paraphrase
  - sharing_incontext_risky_hop_relay_vague
  - sharing_incontext_benign_hop_relay_vague
lengths: [5]
patterns: [none]
n_samples: 50
arm: baseline
max_steps: 8
concurrency: 16

# Logprob mode only (`both` or `logprob` on the job line).
probe_points:
  - id: start
