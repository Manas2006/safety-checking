# plan_v2_nonotes: plan_v2 with the four note-writing episodes (two per layer) swapped for read-only two-call
# episodes from the light filler; everything else identical. Tests whether writing notes is the
# ingredient that decays the check.
# Both patterns use the same lists (this control is about the `none` pattern).
#
layers:
  - length: 5
    episodes:
      none: &tail
        - ep_tail_eng_roster
        - ep_tail_design_review
        - ep_tail_atlas_recap
      performed: *tail

  - length: 20
    episodes:
      # 15 calls
      none: &l20
        - ep_inbox_scan
        - ep_checklist_search
        - ep_bugbash_followup
        - ep_styleguide_check
        - ep_eng_roster
        - ep_standup_prep
        - ep_l200_research_team
        - ep_l200_yusuf_team
        - ep_inbox_triage
      performed: *l20

  - length: 50
    episodes:
      # 30 calls
      none: &l50
        - ep_research_readout
        - ep_l200_ana_readout_owner
        - ep_design_slot
        - ep_procurement_search
        - ep_ops_lookup
        - ep_week_overview
        - ep_design_people
        - ep_search_metrics
        - ep_weekly_prep
        - ep_inbox_catchup
        - ep_ops_check
        - ep_docs_audit
        - ep_l200_wed_retro
        - ep_design_sync
        - ep_digest_search
      performed: *l50
