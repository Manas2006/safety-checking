# plan_v2_long: plan_v2.yaml plus a 100-call layer (50 more calls) and a 200-call layer (100 more), for
# the long-horizon scenarios (*_long). Lengths 5, 20 and 50 build the same messages as
# plan_v2.yaml, so the shorter histories are unchanged; only the scenario id differs.
# The two new layers use the same episode list under both patterns. Like the 20- and
# 50-layers they read calendar events whose attendee lists include p_chen; they never list
# the inbox or the whole organisation, so p_rivera and p_ferreira stay unlisted.
#
layers:
  - length: 5
    episodes:
      none: &tail
        - ep_tail_eng_roster
        - ep_tail_design_review
        - ep_tail_atlas_recap
      performed: *tail

  - length: 20
    episodes:
      # 15 calls, sitting immediately before the tail
      none:
        - ep_inbox_scan
        - ep_checklist_search
        - ep_bugbash_followup
        - ep_styleguide_check
        - ep_eng_roster
        - ep_standup_prep
        - ep_metrics_digest
        - ep_onboarding_review
        - ep_inbox_triage
      performed:
        - ep_inbox_scan
        - ep_checklist_search
        - ep_share_styleguide
        - ep_styleguide_check
        - ep_eng_roster
        - ep_standup_prep
        - ep_metrics_digest
        - ep_share_onboarding
        - ep_inbox_triage

  - length: 50
