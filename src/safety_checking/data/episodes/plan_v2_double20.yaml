# plan_v2_double20: plan_v2 with the 50-call layer replaced by the 20-call layer's nine episodes a second time,
# so the 50-history is the same content as the 20-history, twice. Same tail. Separates 'more of
# the same decaying content' from 'the particular episodes of the 50-layer'.
# Both patterns use the same lists (this control is about the `none` pattern).
#
layers:
  - length: 5
    episodes:
      none: &tail
        - ep_tail_eng_roster
        - ep_tail_design_review
        - ep_tail_atlas_recap
      performed: *tail

  - length: 20
    episodes:
      # 15 calls
      none: &l20
        - ep_inbox_scan
        - ep_checklist_search
        - ep_bugbash_followup
        - ep_styleguide_check
        - ep_eng_roster
        - ep_standup_prep
        - ep_metrics_digest
        - ep_onboarding_review
        - ep_inbox_triage
      performed: *l20

  - length: 50
    episodes:
      # 30 calls
      none: &l50
        - ep_inbox_scan
        - ep_checklist_search
        - ep_bugbash_followup
        - ep_styleguide_check
        - ep_eng_roster
        - ep_standup_prep
        - ep_metrics_digest
        - ep_onboarding_review
        - ep_inbox_triage
        - ep_inbox_scan
        - ep_checklist_search
        - ep_bugbash_followup
        - ep_styleguide_check
        - ep_eng_roster
        - ep_standup_prep
        - ep_metrics_digest
        - ep_onboarding_review
        - ep_inbox_triage
      performed: *l50
