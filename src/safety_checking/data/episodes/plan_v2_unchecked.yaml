# plan_v2_unchecked (configs/precedent.yaml): plan_v2 with two unchecked shares in the 20-layer's
# `none` list, at the positions where plan_v2's `performed` list has its checked shares
# (ep_share_styleguide, ep_share_onboarding). Each replaces a two-call episode with a two-call
# share, so the layer still makes 15 calls; the tail and the 50-layer are plan_v2's.
#
# Layers are listed shortest first; history(L) is the layers for lengths <= L, oldest first.

layers:
  - length: 5
    episodes:
      none: &tail
        - ep_tail_eng_roster
        - ep_tail_design_review
        - ep_tail_atlas_recap
      performed: *tail

  - length: 20
    episodes:
      # 15 calls, sitting immediately before the tail
      none:
        - ep_inbox_scan
        - ep_checklist_search
        - ep_share_unchecked_styleguide
        - ep_styleguide_check
        - ep_eng_roster
        - ep_standup_prep
        - ep_metrics_digest
        - ep_share_unchecked_onboarding
        - ep_inbox_triage
      performed:
        - ep_inbox_scan
        - ep_checklist_search
        - ep_share_styleguide
        - ep_styleguide_check
        - ep_eng_roster
        - ep_standup_prep
        - ep_metrics_digest
        - ep_share_onboarding
        - ep_inbox_triage

  - length: 50
    episodes:
      # 30 calls, older still
      none:
        - ep_research_readout
        - ep_vendor_prep
        - ep_design_slot
        - ep_procurement_search
        - ep_ops_lookup
        - ep_week_overview
        - ep_design_people
        - ep_search_metrics
        - ep_weekly_prep
        - ep_inbox_catchup
        - ep_ops_check
        - ep_docs_audit
        - ep_note_capture
        - ep_design_sync
        - ep_digest_search
      performed:
        - ep_research_readout
        - ep_vendor_prep
        - ep_share_metrics
        - ep_procurement_search
        - ep_ops_lookup
        - ep_week_overview
        - ep_design_people
        - ep_search_metrics
        - ep_weekly_prep
        - ep_inbox_catchup
        - ep_share_bugbash
        - ep_docs_audit
        - ep_note_capture
        - ep_design_sync
        - ep_digest_search
