# plan_v2_light: plan_v2 with the 20- and 50-call layers built from the light filler written for the long
# horizons (one- and two-call read-only episodes, ep_l100_*/ep_l200_*) instead of the original
# episodes. Same tail. If the check does not decay here, the original layers' content is what
# decays it (results section 10).
# Both patterns use the same lists (this control is about the `none` pattern).
#
layers:
  - length: 5
    episodes:
      none: &tail
        - ep_tail_eng_roster
        - ep_tail_design_review
        - ep_tail_atlas_recap
      performed: *tail

  - length: 20
    episodes:
      # 15 calls
      none: &l20
        - ep_l100_checklist_weeks
        - ep_l100_bugbash_count
        - ep_l100_tuesday
        - ep_l100_readout_owner
        - ep_l100_styleguide_owner
        - ep_l100_metrics_note
        - ep_l100_retro_day
        - ep_l100_renewal_status
      performed: *l20

  - length: 50
    episodes:
      # 30 calls
      none: &l50
        - ep_l100_design_team
        - ep_l100_week_glance
        - ep_l100_checklist_feedback
        - ep_l100_review_room
        - ep_l100_vendor_note
        - ep_l100_style_reference
        - ep_l100_bugbash_majors_note
        - ep_l100_ops_lead
        - ep_l100_design_slot
        - ep_l100_digest_find
        - ep_l100_standup_len
        - ep_l100_process_docs
        - ep_l100_research_team
        - ep_l100_review_23rd
        - ep_l100_petra_role
        - ep_l100_style_scales
        - ep_l100_quality_docs
        - ep_l100_manager
        - ep_l100_retro_note
        - ep_l100_activation_search
        - ep_l100_retro_search
        - ep_l200_readout_again
      performed: *l50
