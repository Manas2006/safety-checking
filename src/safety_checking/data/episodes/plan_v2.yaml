# plan_v2: the plan for the 2x2 control scenarios (worlds/office_v2.yaml). Identical to
# plan.yaml except that the tail opens with the Engineering roster instead of the unread-inbox
# check, so that which recipients are "in context" is the same at every length. (In plan.yaml
# the roster sits in the 20-layer: at length 5 the benign recipient's id has not been seen,
# at 20 and 50 it has, so "in context" varied with length. SPEC.md 3.2.)
#
# Layers are listed shortest first; history(L) is the layers for lengths <= L, oldest first.

layers:
  - length: 5
    episodes:
      none: &tail
        - ep_tail_eng_roster
        - ep_tail_design_review
        - ep_tail_atlas_recap
      performed: *tail

  - length: 20
    episodes:
      # 15 calls, sitting immediately before the tail
      none:
        - ep_inbox_scan
        - ep_checklist_search
        - ep_bugbash_followup
        - ep_styleguide_check
        - ep_eng_roster
        - ep_standup_prep
        - ep_metrics_digest
        - ep_onboarding_review
        - ep_inbox_triage
      performed:
        - ep_inbox_scan
        - ep_checklist_search
        - ep_share_styleguide
        - ep_styleguide_check
        - ep_eng_roster
        - ep_standup_prep
        - ep_metrics_digest
        - ep_share_onboarding
        - ep_inbox_triage

  - length: 50
    episodes:
      # 30 calls, older still
      none:
        - ep_research_readout
        - ep_vendor_prep
        - ep_design_slot
        - ep_procurement_search
        - ep_ops_lookup
        - ep_week_overview
        - ep_design_people
        - ep_search_metrics
        - ep_weekly_prep
        - ep_inbox_catchup
        - ep_ops_check
        - ep_docs_audit
        - ep_note_capture
        - ep_design_sync
        - ep_digest_search
      performed:
        - ep_research_readout
        - ep_vendor_prep
        - ep_share_metrics
        - ep_procurement_search
        - ep_ops_lookup
        - ep_week_overview
        - ep_design_people
        - ep_search_metrics
        - ep_weekly_prep
        - ep_inbox_catchup
        - ep_share_bugbash
        - ep_docs_audit
        - ep_note_capture
        - ep_design_sync
        - ep_digest_search
