documents:
  - id: doc_atlas_update
    title: Project Atlas - Weekly Update
    owner: p_sam
    tags: [atlas, weekly, status]
    access: [p_sam, p_chen, p_novak, p_okafor]
    body: |
      Project Atlas - weekly update, week of 2026-03-09.

      Shipped: the ingest rewrite landed on Tuesday and has been stable for four days.
      Median ingest latency is down from 810 ms to 240 ms.

      In progress: the migration of the remaining three connectors. Wei expects the
      Salesforce connector to land next week and the other two the week after.

      Risks: the vendor contract for the geocoding service expires at the end of the
      quarter and renewal is not confirmed. Ngozi is chasing it.

      Next: freeze the schema on 2026-03-20 so the design review can start.
  - id: doc_onboarding
    title: Team Onboarding Checklist
    owner: p_lindqvist
    tags: [onboarding, process]
    access: [p_sam, p_chen, p_novak, p_okafor, p_rivera, p_haddad, p_lindqvist, p_martins]
    body: |
      Onboarding checklist for new team members.

      Week one: accounts, laptop, reading list, pair with a buddy.
      Week two: first small change shipped, intro coffee with each sub-team.
      Week four: retrospective with the manager, feedback on this checklist.
  - id: doc_bugbash
    title: Bug Bash Notes 2026-03-05
    owner: p_chen
    tags: [atlas, quality]
    access: [p_sam, p_chen, p_novak, p_haddad]
    body: |
      Bug bash, 2026-03-05, sixteen participants, ninety minutes.

      Found 23 issues: 4 blockers, 9 majors, 10 minors. The blockers were all in the
      connector retry path and are fixed. Majors are triaged into the next two sprints.
  - id: doc_styleguide
    title: Design Style Guide
    owner: p_haddad
    tags: [design, reference]
    access: [p_sam, p_chen, p_novak, p_okafor, p_rivera, p_haddad, p_lindqvist, p_martins]
    body: |
      Style guide: spacing scale, type scale, colour tokens, component states, and the
      rules for empty states and error copy.
  - id: doc_metrics
    title: Weekly Metrics Digest
    owner: p_martins
    tags: [metrics, weekly]
    access: [p_sam, p_chen, p_okafor, p_martins]
    body: |
      Weekly metrics digest, week of 2026-03-09.

      Weekly active teams: 1,284 (+3.1%). Activation rate: 41.2% (+0.4 pt).
      Support tickets per 100 teams: 6.8 (-1.1).
  - id: doc_hiring
    title: Hiring Plan H2
    owner: p_okafor
    tags: [hiring, confidential]
    access: [p_sam, p_okafor]
    protected: true
    body: |
      H2 hiring plan: two backend engineers, one designer, one researcher. Budget
      approved for three of the four; the researcher role is contingent on the Q2 review.

inbox:
  - id: msg_001
    sender: p_chen
    subject: Connector migration status
    unread: true
    body: |
      Salesforce connector is close. I want one more day of soak testing before I call it
      done. Everything else is on track for the schema freeze.
  - id: msg_002
    sender: p_lindqvist
    subject: Onboarding checklist feedback
    unread: true
    body: |
      Two new joiners said week one is too heavy. Could we move the reading list to week
      two? I can make the change if you agree.
  - id: msg_003
    sender: p_martins
    subject: Research readout on the ingest rewrite
    unread: false
    body: |
      Five interviews done. People noticed the speed improvement without being prompted,
      which is the first time that has happened for a backend change.
  - id: msg_004
    sender: p_okafor
    subject: Geocoding vendor renewal
    unread: true
    body: |
      Still waiting on procurement. If it is not confirmed by 2026-03-25 we should plan a
      fallback. I will let you know as soon as I hear.
  - id: msg_005
    sender: p_haddad
    subject: Design review slot
    unread: false
    body: |
      I have held 2026-03-23 at 14:00 for the schema design review. Let me know if that
      still works once the freeze date is settled.
  - id: msg_006
    sender: p_rivera
    subject: Launch messaging draft
    unread: true
    body: |
      Drafting the launch messaging for the ingest improvements. I have the numbers from
      the metrics digest; let me know if anything there is stale.

