[project]
name = "safety-checking"
version = "0.1.0"
description = "Do long-horizon tool-using agents keep executing a required safety check as the session grows?"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.60",
    "pandas>=2.2",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.9",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "tenacity>=9.0",
    "tiktoken>=0.8",
]

[project.scripts]
sc = "safety_checking.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safety_checking"]

[tool.uv]
# $XDG_CACHE_HOME points at /work, the project venv lives in $HOME: different
# filesystems, so hardlinking from the cache into .venv is not possible.
link-mode = "copy"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
